# ROS2 node-parameters wrapping of config/avia.yaml + config/camera_pinhole.yaml.
#
# In the ROS1 launch file (launch/mapping_avia.launch), avia.yaml was loaded
# globally via `rosparam load` and camera_pinhole.yaml was loaded into the
# "laserMapping" node via a per-node `rosparam file` tag; both ended up as
# private parameters of that one node. This file merges both sets of keys
# under a single `ros__parameters:` block for "laser_mapping_node", the
# name the ported rclcpp node (LIVMapper) registers itself under -- see
# src/LIVMapper.cpp's constructor.
#
# The original config/avia.yaml and config/camera_pinhole.yaml are left
# untouched so the ROS1 launch path keeps working as-is.

laser_mapping_node:
  ros__parameters:
    common:
      img_topic: "/left_camera/image"
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false

    extrin_calib:
      extrinsic_T: [0.04165, 0.02326, -0.0284]
      extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
      Rcl: [0.00610193, -0.999863, -0.0154172,
            -0.00615449, 0.0153796, -0.999863,
            0.999962, 0.00619598, -0.0060598]
      Pcl: [0.0194384, 0.104689, -0.0251952]

    time_offset:
      imu_time_offset: 0.0
      img_time_offset: 0.1
      exposure_time_init: 0.0

    preprocess:
      point_filter_num: 1
      filter_size_surf: 0.1
      lidar_type: 1 # Livox Avia LiDAR
      scan_line: 6
      blind: 0.8

    vio:
      max_iterations: 5
      outlier_threshold: 1000
      img_point_cov: 100
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      raycast_en: false
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1

    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.5
      gyr_cov: 0.3
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001

    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0025
      voxel_size: 0.5
      max_layer: 2
      max_points_num: 50
      layer_init_num: [5, 5, 5, 5, 5]

    local_map:
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8

    uav:
      imu_rate_odom: false
      gravity_align_en: false

    publish:
      dense_map_en: true
      pub_effect_point_en: false
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.0

    evo:
      seq_name: "CBD_Building_01"
      pose_output_en: false

    pcd_save:
      pcd_save_en: false
      colmap_output_en: false # need to set interval = -1
      filter_size_pcd: 0.15
      interval: -1
      # how many LiDAR frames saved in each pcd file;
      # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

    gs:
      gs_iterations: 40
      gs_position_lr: 0.01
      gs_feature_lr: 0.01
      gs_opacity_lr: 0.1
      gs_scaling_lr: 1.8
      gs_rotation_lr: 0.01

    scale_factor: 0.035
    GS_voxel_size: 1
    root_voxel_size: 0.01
    octree_max_level: 3

    # From config/camera_pinhole.yaml
    cam_model: "Pinhole"
    cam_width: 1280
    cam_height: 1024
    scale: 0.5
    cam_fx: 1293.56944
    cam_fy: 1293.3155
    cam_cx: 626.91359
    cam_cy: 522.799224
    cam_d0: -0.076160
    cam_d1: 0.123001
    cam_d2: -0.00113
    cam_d3: 0.000251
